version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - enhancement
      - dependency-management
    assignees:
      - ialejandro
      - amartingarcia
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: helm
    directory: "/charts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - enhancement
      - dependency-management
    assignees:
      - ialejandro
      - amartingarcia
    groups:
      helm:
        patterns:
          - "*"
    commit-message:
      prefix: fix
      include: scope
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
